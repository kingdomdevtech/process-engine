name: Uninstall Process Engine Windows Service (One-Time)

on:
    workflow_dispatch:
        inputs:
            target_environment:
                description: GitHub environment / Windows host to target
                type: choice
                options:
                    - production
                    - staging
                required: true
            confirm_service_name:
                description: Type ProcessEngineWorker to confirm uninstalling that service
                type: string
                required: true

permissions:
    id-token: write
    contents: read

concurrency:
    group: windows-service-uninstall-${{ inputs.target_environment }}
    cancel-in-progress: false

jobs:
    uninstall-service:
        runs-on: ubuntu-latest
        environment: ${{ inputs.target_environment == 'production' && 'process-engine-production' || 'process-engine-staging' }}

        steps:
            - name: Validate uninstall confirmation and target
              env:
                  CONFIRM_SERVICE_NAME: ${{ inputs.confirm_service_name }}
                  AWS_REGION: ${{ vars.AWS_REGION }}
                  EC2_INSTANCE_ID: ${{ vars.EC2_SERVICE_INSTANCE_ID }}
                  AWS_ROLE_DEPLOY: ${{ secrets.AWS_ROLE_DEPLOY }}
              run: |
                  set -euo pipefail

                  if [[ "$CONFIRM_SERVICE_NAME" != "ProcessEngineWorker" ]]; then
                    echo "Confirmation must exactly match ProcessEngineWorker; no changes were made."
                    exit 1
                  fi
                  if [[ -z "$AWS_ROLE_DEPLOY" || -z "$AWS_REGION" || -z "$EC2_INSTANCE_ID" ]]; then
                    echo "AWS_ROLE_DEPLOY, AWS_REGION, and EC2_SERVICE_INSTANCE_ID must be configured in the selected GitHub environment."
                    exit 1
                  fi
                  echo "Confirmed: will uninstall ProcessEngineWorker from the selected Windows host."
                  echo "This does not delete the application files, Python installation, or work directory."

            - name: Configure AWS credentials using OIDC
              uses: aws-actions/configure-aws-credentials@v3
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_DEPLOY }}
                  aws-region: ${{ vars.AWS_REGION }}

            - name: Stop and uninstall Windows service via SSM
              env:
                  AWS_REGION: ${{ vars.AWS_REGION }}
                  EC2_INSTANCE_ID: ${{ vars.EC2_SERVICE_INSTANCE_ID }}
              run: |
                  set -euo pipefail

                  cat > uninstall-process-engine-service.ps1 <<'EOF'
                  $ErrorActionPreference = 'Stop'
                  $serviceName = 'ProcessEngineWorker'
                  $service = Get-Service -Name $serviceName -ErrorAction SilentlyContinue

                  if (-not $service) {
                    Write-Output "Service '$serviceName' is not installed; nothing to do."
                    exit 0
                  }

                  if ($service.Status -ne 'Stopped') {
                    Write-Output "Stopping service '$serviceName'..."
                    Stop-Service -Name $serviceName -Force
                    $service = Get-Service -Name $serviceName
                    $service.WaitForStatus('Stopped', [TimeSpan]::FromSeconds(60))
                  }

                  Write-Output "Deleting service '$serviceName'..."
                  $deleteOutput = & sc.exe delete $serviceName 2>&1
                  $deleteOutput | Write-Output
                  if ($LASTEXITCODE -ne 0) {
                    throw "sc.exe delete failed with exit code $LASTEXITCODE."
                  }

                  $deadline = (Get-Date).AddSeconds(30)
                  while ((Get-Service -Name $serviceName -ErrorAction SilentlyContinue) -and (Get-Date) -lt $deadline) {
                    Start-Sleep -Seconds 1
                  }
                  if (Get-Service -Name $serviceName -ErrorAction SilentlyContinue) {
                    throw "Service '$serviceName' is still registered after deletion."
                  }

                  Write-Output "Service '$serviceName' was stopped and uninstalled. Application files were left untouched."
                  EOF

                  PARAMETERS=$(jq -n --rawfile script uninstall-process-engine-service.ps1 '{commands: ($script | split("\n"))}')
                  COMMAND_ID=$(aws ssm send-command \
                    --document-name "AWS-RunPowerShellScript" \
                    --targets "Key=instanceIds,Values=$EC2_INSTANCE_ID" \
                    --region "$AWS_REGION" \
                    --comment "One-time uninstall of ProcessEngineWorker service" \
                    --parameters "$PARAMETERS" \
                    --query "Command.CommandId" \
                    --output text)

                  echo "SSM command: $COMMAND_ID"
                  for attempt in {1..30}; do
                    INVOCATION=$(aws ssm get-command-invocation \
                      --command-id "$COMMAND_ID" \
                      --instance-id "$EC2_INSTANCE_ID" \
                      --region "$AWS_REGION" \
                      --output json 2>/dev/null || true)
                    STATUS=$(jq -r '.Status // "Pending"' <<< "$INVOCATION")
                    echo "Attempt $attempt/30: $STATUS"

                    case "$STATUS" in
                      Success)
                        jq -r '.StandardOutputContent // empty' <<< "$INVOCATION"
                        exit 0
                        ;;
                      Failed|Cancelled|TimedOut|DeliveryTimedOut|ExecutionTimedOut|Undeliverable|Terminated)
                        jq -r '"STDOUT:\n" + (.StandardOutputContent // "") + "\nSTDERR:\n" + (.StandardErrorContent // "")' <<< "$INVOCATION"
                        exit 1
                        ;;
                    esac
                    sleep 10
                  done

                  echo "SSM command did not complete within five minutes. Retrieving the latest invocation details..."
                  INVOCATION=$(aws ssm get-command-invocation \
                    --command-id "$COMMAND_ID" \
                    --instance-id "$EC2_INSTANCE_ID" \
                    --region "$AWS_REGION" \
                    --output json 2>/dev/null || true)
                  jq -r '"STDOUT:\n" + (.StandardOutputContent // "") + "\nSTDERR:\n" + (.StandardErrorContent // "")' <<< "$INVOCATION"
                  echo "SSM command ID: $COMMAND_ID"
                  exit 1
