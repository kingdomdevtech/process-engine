# Environment for the Copilot coding agent (github.com "assign to Copilot").
#
# The agent runs on a GitHub-hosted Ubuntu runner with no network access once it
# starts working, so everything it needs has to be installed here. The job MUST
# be called `copilot-setup-steps`, and the file has to be on the default branch
# before GitHub will pick it up.
#
# This only affects the cloud agent. Copilot in VS Code uses your local venv.
name: Copilot setup steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # the project's floor; catches 3.12-only syntax
          cache: pip

      # All three distributions, editable, as a contributor installs them.
      # `excel` is listed but resolves to nothing here — pywin32 carries a
      # `sys_platform == 'win32'` marker — so the Excel plugin imports but cannot
      # be exercised on this runner. Everything else installs cleanly on Linux.
      - name: Install the packages and their test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          # the optional SDKs too, so the S3/SES/Azure plugins are importable here
          pip install -e "packages/process_engine[excel,mysql,aws,azure]"

      - name: Install the example entry-point plugin
        run: pip install -e examples/hello-plugin

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: designer/package-lock.json

      - name: Install designer dependencies
        working-directory: designer
        run: npm install

      # Fail here rather than leaving the agent to discover a broken checkout.
      # Both are the commands it will run to verify its own changes.
      - name: Verify the suite and the frontend build
        run: |
          pytest -q
          npm run build --prefix designer
