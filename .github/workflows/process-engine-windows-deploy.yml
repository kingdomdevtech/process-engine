name: Process Engine Service

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - staging
    paths:
      - "packages/process_engine/**"
      - "packages/process_engine_core/**"
      - "pyproject.toml"
      - "requirements-dev.txt"
      - ".github/workflows/process-engine-windows-deploy.yml"

permissions:
  id-token: write
  contents: read

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    environment: ${{
      github.ref_name == 'main' && 'process-engine-production'
      || github.ref_name == 'staging' && 'process-engine-staging'
      }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_DEPLOY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set image tag based on branch
        id: vars
        run: |
          BRANCH="${GITHUB_REF##*/}"
          if [ "$BRANCH" = "main" ]; then
            TAG="prod"
          elif [ "$BRANCH" = "staging" ]; then
            TAG="staging"
          else
            TAG="${BRANCH//\//-}"  # sanitize slashes
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Python wheels for the engine packages
        run: |
          python -m pip install --upgrade pip setuptools wheel
          mkdir -p dist
          python -m pip wheel --wheel-dir dist ./packages/process_engine_core
          python -m pip wheel --wheel-dir dist ./packages/process_engine

      - name: Generate Windows service installer bundle
        run: |
          # Generate the installation and launcher scripts for Windows
          # These scripts are executed on the target Windows server via SSM
          # 
          # IMPORTANT: This Windows server uses LOCALHOST MySQL
          # The PROCESS_ENGINE_DB_URL secret should be set to:
          #   mysql+pymysql://process_engine:password@localhost:3306/process_engine
          # 
          # The Linux container will connect to this MySQL server via the Windows host IP
          cat > install-process-engine.ps1 <<'EOF'
          $ErrorActionPreference = 'Stop'

          $tag = "${{ steps.vars.outputs.tag }}"
          $root = "C:\apps\releases\process-engine\$tag"
          $wheelDir = Join-Path $root "wheels"
          $venvDir = Join-Path $root "venv"

          # Create destination directories
          Write-Host "Creating directories..."
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          New-Item -ItemType Directory -Force -Path $wheelDir | Out-Null

          # Extract the deployment package
          Write-Host "Extracting deployment package..."
          Expand-Archive -Path "C:\Temp\process-engine-$tag.zip" -DestinationPath $root -Force
          Copy-Item -Path (Join-Path $root "dist\*") -Destination $wheelDir -Force

          # Create or update virtual environment
          Write-Host "Setting up Python virtual environment..."
          if (-not (Test-Path $venvDir)) {
            py -3.11 -m venv $venvDir
          }

          # Install dependencies
          Write-Host "Installing Python packages..."
          & (Join-Path $venvDir "Scripts\python.exe") -m pip install --upgrade pip setuptools wheel
          & (Join-Path $venvDir "Scripts\python.exe") -m pip install --no-index --find-links $wheelDir "process-engine-core==0.1.0" "process-engine==0.1.0"

          # Set environment variables at machine level
          Write-Host "Configuring environment variables..."
          # Engine service uses LOCAL MySQL connection (PROCESS_ENGINE_DB_URL_LOCAL secret)
          [Environment]::SetEnvironmentVariable('PROCESS_ENGINE_DB_URL', '${{ secrets.PROCESS_ENGINE_DB_URL_LOCAL }}', 'Machine')
          [Environment]::SetEnvironmentVariable('PROCESS_ENGINE_SECRET_KEY', '${{ secrets.PROCESS_ENGINE_SECRET_KEY }}', 'Machine')
          [Environment]::SetEnvironmentVariable('PROCESS_ENGINE_DESIGNER_URL', '${{ vars.PROCESS_ENGINE_DESIGNER_URL }}', 'Machine')
          [Environment]::SetEnvironmentVariable('PROCESS_ENGINE_WORK_DIR', '${{ vars.PROCESS_ENGINE_WORK_DIR || "C:\\ProcessEngine\\workdir" }}', 'Machine')
          [Environment]::SetEnvironmentVariable('PROCESS_ENGINE_STEP_WORKERS', '${{ vars.PROCESS_ENGINE_STEP_WORKERS || "8" }}', 'Machine')
          [Environment]::SetEnvironmentVariable('PROCESS_ENGINE_QUEUE_POLL_SECONDS', '${{ vars.PROCESS_ENGINE_QUEUE_POLL_SECONDS || "2.0" }}', 'Machine')
          [Environment]::SetEnvironmentVariable('PROCESS_ENGINE_LOG_LEVEL', '${{ vars.PROCESS_ENGINE_LOG_LEVEL || "INFO" }}', 'Machine')

          # Create launcher script
          Write-Host "Creating launcher script..."
          $launcher = Join-Path $root "run-process-engine.ps1"
          @'
          # Engine service uses LOCAL MySQL connection (PROCESS_ENGINE_DB_URL_LOCAL secret)
          $env:PROCESS_ENGINE_DB_URL = '${{ secrets.PROCESS_ENGINE_DB_URL_LOCAL }}'
          $env:PROCESS_ENGINE_DB_URL = '${{ secrets.PROCESS_ENGINE_DB_URL }}'
          $env:PROCESS_ENGINE_SECRET_KEY = '${{ secrets.PROCESS_ENGINE_SECRET_KEY }}'
          $env:PROCESS_ENGINE_DESIGNER_URL = '${{ vars.PROCESS_ENGINE_DESIGNER_URL }}'
          $env:PROCESS_ENGINE_WORK_DIR = '${{ vars.PROCESS_ENGINE_WORK_DIR || "C:\\ProcessEngine\\workdir" }}'
          $env:PROCESS_ENGINE_STEP_WORKERS = '${{ vars.PROCESS_ENGINE_STEP_WORKERS || "8" }}'
          $env:PROCESS_ENGINE_QUEUE_POLL_SECONDS = '${{ vars.PROCESS_ENGINE_QUEUE_POLL_SECONDS || "2.0" }}'
          $env:PROCESS_ENGINE_LOG_LEVEL = '${{ vars.PROCESS_ENGINE_LOG_LEVEL || "INFO" }}'
          $venvPath = if ('${{ vars.PROCESS_ENGINE_VENV_PATH }}') { '${{ vars.PROCESS_ENGINE_VENV_PATH }}' } else { (Join-Path $root 'venv') }
          & (Join-Path $venvPath 'Scripts\python.exe') -m process_engine
          '@ | Set-Content -Path $launcher -Encoding UTF8

          # Configure and start Windows Service
          Write-Host "Configuring Windows service..."
          $serviceName = '${{ vars.PROCESS_ENGINE_SERVICE_NAME || "ProcessEngineWorker" }}'

          if (Get-Service -Name $serviceName -ErrorAction SilentlyContinue) {
            Write-Host "Stopping existing service..."
            Stop-Service -Name $serviceName -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 3
            sc.exe delete $serviceName | Out-Null
          }

          $binPath = '"C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File "' + $launcher + '"'
          sc.exe create $serviceName binPath= $binPath start= auto obj= LocalSystem
          sc.exe failure $serviceName reset= 86400 actions= restart/5000
          sc.exe description $serviceName "Process Engine worker service"

          Write-Host "Starting service..."
          Start-Service -Name $serviceName

          # Verify service status
          $service = Get-Service -Name $serviceName
          Write-Host "Service status: $($service.Status)"

          if ($service.Status -ne 'Running') {
            throw "Service failed to start"
          }

          Write-Host "✅ Installation completed successfully"
          EOF

          # Create deployment package
          zip -r "process-engine-${{ steps.vars.outputs.tag }}.zip" dist install-process-engine.ps1

      - name: Upload deployment package to S3
        run: |
          aws s3 cp "process-engine-${{ steps.vars.outputs.tag }}.zip" \
            "s3://${{ vars.S3_BUCKET_DEPLOYMENTS }}/process-engine/process-engine-${{ steps.vars.outputs.tag }}.zip"

      - name: Deploy via SSM to Windows server
        run: |
          cat > deploy-from-s3.ps1 <<'EOF'
          $ErrorActionPreference = 'Stop'
          $tag = "${{ steps.vars.outputs.tag }}"
          $dest = "C:\apps\releases\process-engine\$tag"
          $zipPath = "C:\Temp\process-engine-$tag.zip"
          $s3Key = "process-engine/process-engine-$tag.zip"

          Write-Host "Preparing deployment..."
          New-Item -ItemType Directory -Force -Path $dest | Out-Null

          Write-Host "Downloading from S3..."
          Read-S3Object -BucketName "${{ vars.S3_BUCKET_DEPLOYMENTS }}" -Key $s3Key -File $zipPath

          Write-Host "Extracting deployment package..."
          Expand-Archive -Path $zipPath -DestinationPath $dest -Force

          $psScript = Join-Path $dest "install-process-engine.ps1"
          if (-not (Test-Path $psScript)) {
            throw "❌ Missing deploy script: $psScript"
          }

          Write-Host "Executing installation script..."
          & $psScript
          EOF

          json_lines=$(jq -R . < deploy-from-s3.ps1 | jq -s .)

          EC2_INSTANCE_ID=${{ vars.EC2_SERVICE_INSTANCE_ID }}
          AWS_REGION=${{ vars.AWS_REGION }}

          echo "📤 Sending command to EC2 instance..."
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunPowerShellScript" \
            --targets "Key=instanceIds,Values=$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --comment "Deploy Process Engine to Windows server (${{ steps.vars.outputs.tag }})" \
            --parameters commands="$json_lines" \
            --query "Command.CommandId" --output text)

          echo "command_id=$COMMAND_ID" >> $GITHUB_OUTPUT

          echo "⏳ Waiting for SSM command to complete..."
          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" --output text)

            echo "Attempt $i/30: $STATUS"

            if [[ "$STATUS" == "Success" ]]; then
              echo "✅ SSM command succeeded."
              exit 0
            elif [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              echo "❌ SSM command failed with status: $STATUS"
              ERROR_OUTPUT=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --region "$AWS_REGION" \
                --query "StandardErrorContent" \
                --output text)
              
              echo "🛑 Error output:"
              echo "$ERROR_OUTPUT"
              exit 1
            fi
            sleep 10
          done

          echo "❌ SSM command did not complete in time (timeout after 5 minutes)."
          exit 1
