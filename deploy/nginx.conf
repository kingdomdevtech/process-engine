# nginx inside the designer container: static SPA, everything server-side proxied.
#
# The point of putting it in front is single origin. The designer's fetches are
# relative (`/api/...`), so nothing has to be told where the API is at build
# time, CORS never enters the picture, and the bearer token in localStorage has
# exactly one place it can go.
#
# Paths are absolute and the pid/temp files live in /tmp so this runs as an
# unprivileged user.

pid /tmp/nginx.pid;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    sendfile on;
    tcp_nopush on;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    upstream process_engine_api {
        server 127.0.0.1:8000;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;

        # a definition with a large payload, or an upload through a webhook
        client_max_body_size 32m;

        location / {
            root /srv/designer;
            # client-side routes (/app/processes/…) are not files: hand them the
            # shell and let react-router work out what they meant
            try_files $uri /index.html;
        }

        # Vite's output is content-hashed, so it can be cached hard. index.html
        # must not be, or a deploy is invisible until someone force-reloads.
        location /assets/ {
            root /srv/designer;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location = /index.html {
            root /srv/designer;
            add_header Cache-Control "no-cache";
        }

        # the API, the handbooks it serves at /help, and FastAPI's own OpenAPI UI
        location ~ ^/(api|help|docs|redoc|openapi\.json) {
            proxy_pass http://process_engine_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            # a foreground run finishes inside the request, and a slow process is
            # not a gateway error
            proxy_read_timeout 600s;
            proxy_buffering off;
        }
    }
}
