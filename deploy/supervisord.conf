# Two processes, one container: uvicorn behind nginx.
#
# Both log to the container's stdout/stderr so `docker logs` shows the whole
# picture, and both are fatal — a container serving the designer without its API
# (or the reverse) looks alive and is not, so supervisord takes the container
# down instead of leaving half of it running.

[supervisord]
nodaemon=true
user=app
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:api]
command=python -m process_engine_api
directory=/data
autorestart=true
startretries=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
# the designer is useless without it, so a dead API ends the container
exitcodes=0
stopasgroup=true
killasgroup=true
priority=10

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
startretries=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=20

[eventlistener:quit_on_failure]
# supervisord's own answer to "one of my programs died for good": turn a
# half-dead container into a stopped one, so the orchestrator restarts it.
events=PROCESS_STATE_FATAL
command=sh -c 'printf "READY\n"; while read line; do kill -TERM "$PPID"; printf "RESULT 2\nOK"; done'
