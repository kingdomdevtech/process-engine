[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "process-engine"
version = "0.1.0"
description = "n8n-style workflow automation: Processes made of Steps, powered by pluggable Plugins"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "croniter>=2",
    "cryptography>=42",  # secrets encrypted at rest (Fernet)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]
excel = [
    "pywin32>=306; sys_platform == 'win32'",
]
mysql = [
    "pymysql>=1.1",
]
aws = [
    "boto3>=1.34",  # Amazon SES email + S3 download plugins
]
azure = [
    "azure-storage-blob>=12.19",  # Azure blob download plugin
    "azure-identity>=1.15",       # only for its "Azure identity of this machine" sign-in
]

[project.scripts]
process-engine = "process_engine.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
