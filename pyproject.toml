# Not a distribution. The product is three of them, under packages/:
#
#   packages/process_engine_core   what a process *is* — installed everywhere
#   packages/process_engine        what runs one — the Windows engine host
#   packages/process_engine_api    the designer's backend — the Linux container
#
# For development, install all three plus the test tools:
#
#   pip install -r requirements-dev.txt
#
# This file stays at the root for the tooling that looks for its configuration
# here — pytest reads the section below, and finds the suite whatever directory
# you invoke it from.

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
